# Font
font_family      MesloLGS Nerd Font
font_size        12.0

# Transparenz - nur für kitty!
background_opacity 0.85

# Blur hinter dem Fenster (Hyprland unterstützt das)
background_blur 20

# EmberNet Farben
foreground              #e2e8f0
background              #0a0a1e
selection_background    #6C5CE7
selection_foreground    #ffffff

# Cursor
cursor                  #c084fc
cursor_text_color       #0a0a1e

# Farben für Terminal Output
color0  #1a1a2e
color1  #f87171
color2  #34d399
color3  #fbbf24
color4  #60a5fa
color5  #c084fc
color6  #00d4ff
color7  #e2e8f0
color8  #374151
color9  #f87171
color10 #34d399
color11 #fbbf24
color12 #60a5fa
color13 #c084fc
color14 #00d4ff
color15 #ffffff

# Fenster
window_padding_width 8
hide_window_decorations yes
